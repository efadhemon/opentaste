name: Release
# Separate from CI. Push `vX.Y.Z` after bumping every version (the workspace
# Cargo.toml and both package.json files) to the same X.Y.Z.
#
# Only a tag publishes. A pull request that touches the release path, or a
# manual run, is a dry run: it builds every target, packs every npm package
# and the VSIX, runs the packed wrapper, and publishes nothing. Do one before
# the first tag of a release, because an npm version cannot be published twice.
#
# Secrets, all in the `release` environment:
#   NPM_TOKEN   an npm automation token that can publish the @opentaste scope
#   VSCE_PAT    an Azure DevOps token for the VS Code Marketplace publisher
#   OVSX_PAT    an Open VSX token for the same publisher namespace
"on":
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/npm-opentaste/**
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
# Every upload-artifact sets `retention-days: 1`: the artifacts only carry
# files between jobs of one run, and a tag attaches the binaries and VSIX to
# the GitHub release, which does not count against the account-wide Actions
# storage quota that a full dry run once hit.
# Every setup-node sets `package-manager-cache: false`: its automatic cache
# needs pnpm before `corepack enable` has provided it (see ci.yml).
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        shell: bash
        run: |
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          # A dry run has no tag, so it checks the three versions agree.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="$cargo"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          ext=$(node -p "require('./packages/vscode-opentaste/package.json').version")
          npm=$(node -p "require('./packages/npm-opentaste/package.json').version")
          echo "tag=$tag cargo=$cargo extension=$ext npm=$npm"
          for v in "$cargo" "$ext" "$npm"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::version $v does not match tag $tag"; exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    # Native runners only. rusqlite bundles SQLite and compiles it from C, so
    # cross-compiling would need a full cross C toolchain per target.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, platform: linux, arch: x64, exe: taste }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, platform: linux, arch: arm64, exe: taste }
          - { target: x86_64-apple-darwin, os: macos-15-intel, platform: darwin, arch: x64, exe: taste }
          - { target: aarch64-apple-darwin, os: macos-14, platform: darwin, arch: arm64, exe: taste }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, platform: win32, arch: x64, exe: taste.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p taste-cli --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.exe }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: taste-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs: [versions, build, extension-package]
    if: needs.versions.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Name the binaries by platform
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/taste-*; do
            name=$(basename "$dir")
            for file in "$dir"/*; do
              case "$file" in
                *.exe) cp "$file" "release/$name.exe" ;;
                *) cp "$file" "release/$name" ;;
              esac
            done
          done
          cp artifacts/vsix/*.vsix release/
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true

  npm-package:
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "taste-*" }
      - name: Pack one package per platform, then the wrapper
        shell: bash
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          # Every path starts with `./`: npm reads `npm/linux-x64` or
          # `packages/npm-opentaste` as a GitHub `owner/repo` shorthand.
          mkdir -p tarballs/platforms tarballs/wrapper
          for dir in artifacts/taste-*; do
            pair="${dir#artifacts/taste-}"
            platform="${pair%-*}"
            arch="${pair##*-}"
            binary=$(ls "$dir"/*)
            out="./npm/$pair"
            node packages/npm-opentaste/scripts/platform-package.js platform "$platform" "$arch" "$binary" "$out" "$VERSION"
            npm pack "$out" --pack-destination tarballs/platforms
          done
          node packages/npm-opentaste/scripts/platform-package.js wrapper packages/npm-opentaste "$VERSION"
          npm pack ./packages/npm-opentaste --pack-destination tarballs/wrapper
          count=$(ls tarballs/platforms/*.tgz | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 platform tarballs, found $count"; exit 1
          fi
      # Lay the packed wrapper and the linux-x64 package out as npm would
      # install them, without the registry, and run `taste` through the wrapper.
      - name: Run the packed wrapper
        shell: bash
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          root=smoke/node_modules/@opentaste
          mkdir -p "$root/cli" "$root/cli-linux-x64"
          tar -xzf tarballs/wrapper/*.tgz -C "$root/cli" --strip-components=1
          tar -xzf tarballs/platforms/opentaste-cli-linux-x64-"$VERSION".tgz -C "$root/cli-linux-x64" --strip-components=1
          out=$(node "$root/cli/bin/taste.js" --version)
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::packed wrapper printed '$out', expected $VERSION"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs
          if-no-files-found: error
          retention-days: 1

  npm:
    needs: [versions, npm-package]
    if: needs.versions.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with: { name: npm-tarballs, path: tarballs }
      # The platform packages go first: the wrapper depends on them.
      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in ./tarballs/platforms/*.tgz ./tarballs/wrapper/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done

  extension-package:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run test
      - run: pnpm --filter opentaste run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/vscode-opentaste/*.vsix
          if-no-files-found: error
          retention-days: 1

  extension-publish:
    # VS Code Marketplace for VS Code, Open VSX for Cursor and Windsurf, which
    # can only install from there.
    needs: [versions, extension-package]
    if: needs.versions.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: vsix, path: vsix }
      - name: VS Code Marketplace
        working-directory: packages/vscode-opentaste
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath ../../vsix/*.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx@1.3.0 publish vsix/*.vsix --pat "$OVSX_PAT"
