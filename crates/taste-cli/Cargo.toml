[package]
name = "taste-cli"
description = "The `taste` command line interface, watcher, git hooks and terminal dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "taste"
path = "src/main.rs"

[dependencies]
taste-core.workspace = true
taste-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
# crossterm comes through `ratatui::crossterm`; depending on it directly would
# put two incompatible versions in the tree.
ratatui = { workspace = true, features = ["crossterm_0_29"] }
notify.workspace = true
serde.workspace = true
# `preserve_order` keeps a developer's `.cursor/mcp.json` in the order they
# wrote it when `taste init` merges into it.
serde_json = { workspace = true, features = ["preserve_order"] }
chrono.workspace = true
# History mining analyses past commits' files in parallel.
rayon.workspace = true
tree-sitter-highlight.workspace = true

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
